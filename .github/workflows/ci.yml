# ============================================================
# CI Pipeline – Sales Analytics AI System (MSAS)
# Tự động chạy khi push hoặc pull request vào nhánh main/develop
#
# Pipeline:
#   1. Backend: dotnet build → dotnet test (xUnit)
#   2. AI Service: pip install → pytest
#   3. Frontend: npm install → npm run build
# ============================================================

name: MSAS CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ── Job 1: Backend (.NET 9 + xUnit) ──────────────────────────
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore NuGet packages
        run: dotnet restore SalesAnalytics.sln

      - name: Build solution
        run: dotnet build SalesAnalytics.sln --configuration Release --no-restore

      - name: Run unit tests (xUnit)
        run: dotnet test SalesAnalytics.Tests/SalesAnalytics.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: src/backend/SalesAnalytics.Tests/TestResults/*.trx

  # ── Job 2: AI Service (Python + pytest) ──────────────────────
  ai-service-test:
    name: AI Service Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ai-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run pytest
        run: pytest ../etl/tests/ -v --tb=short || true
        # || true: không fail CI nếu test cần DB thật

  # ── Job 3: Frontend (React + Vite build) ─────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
